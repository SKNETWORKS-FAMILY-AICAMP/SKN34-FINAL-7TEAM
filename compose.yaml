services:
  backend:
    build: ./backend
    environment:
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      CAIFE_OPENAI_ORDER_MODEL: "${CAIFE_OPENAI_ORDER_MODEL:-gpt-4.1-mini}"
      CAIFE_MENU_DATA_FILE: /app/data/menus/mega/mega_menu.json
      CAIFE_STORE_FACTS_FILE: /app/data/store/store.facts.json
      CAIFE_ORDER_DB_FILE: /app/data/orders/caife.sqlite3
    ports:
      - "127.0.0.1:${CAIFE_BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/app/app
      - ./data/menus/mega:/app/data/menus/mega:ro
      - ./data/store:/app/data/store:ro
      - ./data/orders:/app/data/orders
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend:
    build: ./frontend
    environment:
      CAIFE_API_PROXY_TARGET: http://backend:8000
      CAIFE_WATCH_POLLING: "true"
    ports:
      - "127.0.0.1:${CAIFE_FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.js:/app/vite.config.js
    depends_on:
      - backend
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]

  review:
    build:
      context: ./review_app
    environment:
      CAIFE_PROJECT_ROOT: /app
      CAIFE_REVIEW_DB: /app/review_data/reviews.sqlite3
    ports:
      - "127.0.0.1:${CAIFE_REVIEW_PORT:-8501}:8501"
    volumes:
      - ./data/intents/processed:/app/data/intents/processed:ro
      - ./data/dialogue/processed:/app/data/dialogue/processed:ro
      - caife_review_data:/app/review_data
    restart: unless-stopped

volumes:
  caife_review_data:
    external: true
    name: caife-review_caife_review_data
