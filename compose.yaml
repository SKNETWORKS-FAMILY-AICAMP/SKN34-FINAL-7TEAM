services:
  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      CAIFE_MENU_DATA_FILE: /app/data/menus/mega/mega_menu.json
      CAIFE_ORDER_DB_FILE: /app/data/orders/caife.sqlite3
    ports:
      - "${CAIFE_BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/app/app
      - ./data/menus/mega:/app/data/menus/mega:ro
      - ./data/orders:/app/data/orders
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend:
    build: ./frontend
    environment:
      CAIFE_API_PROXY_TARGET: http://backend:8000
      CAIFE_WATCH_POLLING: "true"
    ports:
      - "${CAIFE_FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.js:/app/vite.config.js
    depends_on:
      - backend
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
